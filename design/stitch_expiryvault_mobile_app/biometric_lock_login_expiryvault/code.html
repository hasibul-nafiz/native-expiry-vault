<script>
  // Simple delightful micro-interaction for PIN keypad demonstration
  (function() {
    let pinCount = 4;
    const pinDisplay = document.getElementById('pin-display');
    const updateDots = () => {
      if (!pinDisplay) return;
      const dots = pinDisplay.children;
      for (let i = 0; i < dots.length; i++) {
        if (i < pinCount) {
          dots[i].className = "w-3.5 h-3.5 rounded-full bg-secondary shadow-sm shadow-secondary/30 transition-all duration-200 scale-105";
        } else {
          dots[i].className = "w-3.5 h-3.5 rounded-full bg-surface-container-highest transition-all duration-200 scale-100";
        }
      }
    };

    document.querySelectorAll('.key-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (pinCount < 6) {
          pinCount++;
          updateDots();
        }
      });
    });

    const delBtn = document.getElementById('keypad-delete');
    if (delBtn) {
      delBtn.addEventListener('click', () => {
        if (pinCount > 0) {
          pinCount--;
          updateDots();
        }
      });
    }

    const faceBtns = [document.getElementById('faceid-trigger'), document.getElementById('keypad-faceid')];
    faceBtns.forEach(btn => {
      if (btn) {
        btn.addEventListener('click', () => {
          pinCount = 6;
          updateDots();
        });
      }
    });
  })();
